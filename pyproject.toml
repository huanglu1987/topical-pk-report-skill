[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topical-pk-tool"
version = "0.1.1"
description = "Local MVP for topical systemic exposure simulation and PK sampling design."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pktool = "pktool.cli:main"

[tool.setuptools.packages.find]
include = ["pktool*"]

[tool.setuptools.package-data]
pktool = ["schemas/*.json"]
