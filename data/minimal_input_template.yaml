# Minimal runnable input for teammate onboarding.
# Required: molecule, concentration, dosage form, dosing amount, and dosing scenario.
# If dosing_scenario is "multiple", dosing_frequency is also required.
# If dose_mg_per_application is blank, the tool calculates:
# concentration_percent_w_w x 10 x daily_amount_g / applications_per_day.
# Without verified same-molecule PK anchors, the tool may use generic fallback
# assumptions; these are not molecule-specific historical data or evidence.
# For a decision-comparable main analysis, copy this to a project-specific file
# and lock the full analysis package: primary comparator, absorption/depot/lag
# ranges, fast-absorption rule, simulation duration, n_simulations, random_seed,
# evidence fetch state, and pktool version. Put alternative assumptions in
# separate named sensitivity YAML files instead of mixing them into the main run.

compound:
  compound_name: "efinaconazole"
  # Optional but strongly recommended when available for molecule-specific planning.
  # half_life_h:
  # volume_l:

product:
  formulation: "film-forming solution"
  concentration_percent_w_w: 3.0
  daily_amount_g: 4.0
  applications_per_day: 1
  # Optional alternative: fill this directly when the active dose is already known.
  dose_mg_per_application:

study_design:
  # Use "single" for single dose or "multiple" for repeated dosing.
  dosing_scenario: "single"
  # Required when dosing_scenario is "multiple": daily_qd, weekly_qw, weekly_biw,
  # or set product.dosing_interval_h directly in hours.
  dosing_frequency: "daily_qd"
  # Used for steady-state planning when dosing_scenario is multiple.
  dosing_frequency_scenarios:
    - name: "daily_qd"
      label: "每日一次"
      dosing_interval_h: 24
    - name: "weekly_qw"
      label: "每周一次"
      dosing_interval_h: 168
    - name: "weekly_biw"
      label: "每周两次"
      dosing_interval_h: 84
  purpose: "exploratory"
  sampling_purposes: ["exploratory"]
  n_simulations: 3000
  random_seed: 20260515
  # Leave duration_h and dosing_duration_h blank/absent unless intentionally
  # overriding the default single-dose or steady-state multiple-dose window.

evidence:
  pubchem: true
  fda: true
  cde: false

report:
  format: "md,xlsx"
